plugins {
    id 'com.android.application'
}

android {
    namespace 'com.myfile.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.myfile.app'
        minSdk 24          // Android 7.0 en adelante
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
    }
}

// Sin dependencias externas: ni anuncios, ni analíticas, ni SDKs de terceros.
dependencies {
}
